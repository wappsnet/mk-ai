<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" opacity="0.1"/>

  <!-- Main shield/verification badge -->
  <path d="M 100 30 L 130 45 L 130 85 Q 130 115 100 135 Q 70 115 70 85 L 70 45 Z"
        fill="url(#gradient1)"
        stroke="#fff"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- Checkmark inside shield -->
  <path d="M 85 80 L 95 90 L 115 65"
        fill="none"
        stroke="#fff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- AI Neural network nodes - Left side -->
  <circle cx="40" cy="100" r="8" fill="url(#gradient2)" opacity="0.9"/>
  <circle cx="30" cy="80" r="6" fill="url(#gradient2)" opacity="0.7"/>
  <circle cx="30" cy="120" r="6" fill="url(#gradient2)" opacity="0.7"/>

  <!-- AI Neural network nodes - Right side -->
  <circle cx="160" cy="100" r="8" fill="url(#gradient3)" opacity="0.9"/>
  <circle cx="170" cy="80" r="6" fill="url(#gradient3)" opacity="0.7"/>
  <circle cx="170" cy="120" r="6" fill="url(#gradient3)" opacity="0.7"/>

  <!-- Connection lines to shield (representing data flow) -->
  <line x1="40" y1="100" x2="70" y2="85" stroke="url(#gradient2)" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="80" x2="70" y2="70" stroke="url(#gradient2)" stroke-width="1.5" opacity="0.4"/>
  <line x1="30" y1="120" x2="70" y2="95" stroke="url(#gradient2)" stroke-width="1.5" opacity="0.4"/>

  <line x1="160" y1="100" x2="130" y2="85" stroke="url(#gradient3)" stroke-width="2" opacity="0.5"/>
  <line x1="170" y1="80" x2="130" y2="70" stroke="url(#gradient3)" stroke-width="1.5" opacity="0.4"/>
  <line x1="170" y1="120" x2="130" y2="95" stroke="url(#gradient3)" stroke-width="1.5" opacity="0.4"/>

  <!-- Additional decorative elements -->
  <circle cx="100" cy="165" r="3" fill="url(#gradient1)" opacity="0.6"/>
  <circle cx="85" cy="175" r="2" fill="url(#gradient2)" opacity="0.5"/>
  <circle cx="115" cy="175" r="2" fill="url(#gradient3)" opacity="0.5"/>
</svg>
